[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "docuextract"
version = "0.1.0"
description = "Official Python SDK for the DocuExtract API — extract structured JSON from any document"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["document", "extraction", "ocr", "invoice", "receipt", "ai", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://docuextract-azure.vercel.app/docs"
Repository = "https://github.com/TheOGSatoshiNakamoto/docuextract"
Documentation = "https://docuextract-azure.vercel.app/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["docuextract*"]
